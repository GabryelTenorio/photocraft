[package]
name = "photocraft-remote"
description = "PhotoCraft Remote Canvas: the tablet page that draws in the desktop app (served by apps/photocraft)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "photocraft_remote"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
miniz_oxide = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "WebSocket", "BinaryType", "MessageEvent", "Event", "EventTarget", "MouseEvent", "PointerEvent", "WheelEvent", "DomRect", "DomTokenList", "Location", "Navigator", "NodeList", "Node", "Performance", "AddEventListenerOptions", "console"] }
