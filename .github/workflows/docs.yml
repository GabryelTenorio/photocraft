name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "book/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mdBook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        env:
          MDBOOK_VERSION: 0.4.52
          MDBOOK_SHA256: c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768
        run: |
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          install_dir="$RUNNER_TEMP/mdbook/bin"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${MDBOOK_SHA256}  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" mdbook
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/mdbook" --version
      - name: Build documentation
        run: mdbook build book
