[alias]
xtask = "run -p xtask --"

# Fastest feedback: typecheck only, no test binary link. Use on every save.
ui-check = "check -p photocraft-ui-egui"

# Starts photocraft with control on 127.0.0.1:7878 (creates .private/control.token if missing). Not release.
# --timings: build timing summary + target/cargo-timings/cargo-timing.html after compile/link.
manual-ui-testing = "run --timings -p photocraft -- --control 7878 --control-token-file .private/control.token"

